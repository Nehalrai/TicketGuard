apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: ticketguard
  labels:
    app: inventory-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: inventory-service
          image: <ECR_REPO_URL>/ticketguard/inventory-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: LOCAL_MODE
              value: "false"
            - name: SEATS_TABLE
              value: "ticketguard-seats"
            - name: DEFAULT_EVENT_SEATS
              value: "500"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          # Deliberately no PodDisruptionBudget floor set too high here — this
          # service is the one Chaos Mesh targets, and part of the point is
          # watching Kubernetes reschedule killed pods while HPA compensates.
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: ticketguard
spec:
  selector:
    app: inventory-service
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: inventory-service-pdb
  namespace: ticketguard
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: inventory-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inventory-service-hpa
  namespace: ticketguard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inventory-service
  minReplicas: 2
  maxReplicas: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 15
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 120